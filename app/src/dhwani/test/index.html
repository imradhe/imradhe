<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Transcript</title>
</head>
<body>
    <h1>Audio Transcript</h1>
    
    <!-- Select Language -->
    <label for="languageSelect">Select Language:</label>
    <select id="languageSelect">
        <option value="hi">Hindi</option>
        <option value="mr">Marathi</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <!-- Add more language options as needed -->
    </select>

    <!-- Upload Audio File -->
    <input type="file" id="audioFile" accept=".wav">
    <button id="transcribeButton">Transcribe</button>

    <!-- Display Transcription -->
    <div id="transcription"></div>

    <script>
        document.getElementById("transcribeButton").addEventListener("click", function() {
            // Step 1: Set the API Endpoint
            var api_url = "http://asr-api.ai4bharat.org/asr/v1/recognize/hi";

            // Step 2: Set Headers
            var myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");

            // Step 3: Set Language, Sampling Rate, and Post-Processors
            var selectedLanguage = document.getElementById("languageSelect").value;
            var sampling_rate = 48000; // Sampling rate (48000, 16000, or 8000)
            var post_processors = ["numbers_only"]; // Post-processors (e.g., "numbers_only" or [])

            // Step 4: Create a FormData object for the audio file
            var audioFile = document.getElementById("audioFile").files[0];
            if (!audioFile) {
                alert("Please select an audio file.");
                return;
            }
            var formData = new FormData();
            formData.append("config", JSON.stringify({
                "language": {
                    "sourceLanguage": selectedLanguage
                },
                "transcriptionFormat": {
                    "value": "transcript"
                },
                "audioFormat": "wav",
                "samplingRate": sampling_rate,
                "postProcessors": post_processors
            }));
            formData.append("audio", audioFile);

            // Step 5: Set Request Options
            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: formData,
                redirect: 'follow'
            };

            // Step 6: Make the API Call
            fetch(api_url, requestOptions)
                .then(response => response.text())
                .then(result => {
                    // Step 7: Handle API Response
                    console.log(result); // Output the API response to the console
                    var responseObj = JSON.parse(result);
                    if (responseObj.status === "SUCCESS" && responseObj.output.length > 0) {
                        var transcript = responseObj.output[0].source;
                        document.getElementById("transcription").textContent = "Transcription: " + transcript; // Display the transcription
                    } else {
                        document.getElementById("transcription").textContent = "Transcription not available.";
                    }
                })
                .catch(error => {
                    console.log('error', error);
                });
        });
    </script>
</body>
</html>
