services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:8080}
      MONGODB_URI: mongodb://mongo:27017/imradhe
      NODE_ENV: ${NODE_ENV:-development}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ASR_URL: ${ASR_URL:-}
      ASR_TOKEN: ${ASR_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
