# Honour the .htaccess that ships with the site
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
</Directory>

# Never serve source, config or blog drafts over HTTP
<DirectoryMatch "^/var/www/html/(content|controllers|models)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(config|config_example|db|functions|headers|router)\.php$|^routes\.json$">
    Require all denied
</FilesMatch>

ServerName localhost
ServerTokens Prod
ServerSignature Off
